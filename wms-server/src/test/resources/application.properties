spring.application.name=wms-server

spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-secret-key-for-integration-tests-minimum-256-bits-long-value
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=1209600000

security.login.max-fail-count=5
security.login.lock-duration-minutes=30

cloud.aws.credentials.access-key=test-access-key
cloud.aws.credentials.secret-key=test-secret-key
cloud.aws.s3.bucket=test-bucket
cloud.aws.region.static=ap-northeast-2

app.cors.allowed-origins=http://localhost:5173

auth.password-reset.token-expiration-minutes=30

app.frontend.base-url=http://localhost:5173

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
