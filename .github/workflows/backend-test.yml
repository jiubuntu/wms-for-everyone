name: Backend Test

on:
  pull_request:
    branches: [dev]
    paths:
      - 'wms-server/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms-server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle test
        run: ./gradlew test --no-daemon
