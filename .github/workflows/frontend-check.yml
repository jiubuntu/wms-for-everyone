name: Frontend Check

on:
  pull_request:
    branches: [dev]
    paths:
      - 'wms-web/**'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wms-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wms-web/package-lock.json

      - run: npm ci

      - name: 타입체크
        run: npx tsc -b

      - name: Lint
        run: npm run lint
