services:
  postgres:
    image: postgres:17-alpine
    container_name: wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wms-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wms-redis
    restart: unless-stopped
    volumes:
      - wms-redis-data:/data

  wms-server:
    build:
      context: ./wms-server

    image: ghcr.io/jiubuntu/wms-server:${IMAGE_TAG:-latest}
    container_name: wms-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    depends_on:
      - postgres
      - redis

  nginx:
    build:
      context: ./wms-web
      args:
        VITE_API_BASE_URL: /api

    image: ghcr.io/jiubuntu/wms-web:${IMAGE_TAG:-latest}
    container_name: wms-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - wms-server

volumes:
  wms-postgres-data:
  wms-redis-data:
